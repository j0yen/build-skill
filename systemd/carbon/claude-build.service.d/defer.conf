# Secondary-lane priority (2026-09-06): fire only when no preferred lane
# (default ryzen7; override BUILD_LANE_PREFER) is reachable with its lane
# enabled. Exit 1 from ExecCondition skips this run without marking the
# unit failed; the path unit re-evaluates on its next trigger.
#
# Second condition: launch the (paid) tick only when at least one queued
# PRD passes this lane's predicate — a secondary lane facing an all-cargo
# queue must not spend a model session to learn that (lane-has-work.sh).
#
# LANE_SKIP_PACE: a condition-skip bypasses ExecStartPost pacing, and the
# path unit's DirectoryNotEmpty is level-triggered, so an unpaced skip
# re-fires once per second (each probing ryzen7 over ssh). The scripts
# sleep this many seconds before exiting 1, holding the unit in
# "activating (condition)" for the window. Must stay under TimeoutStartSec
# (400 in pacing.conf; 300 + ssh probes ≈ 330 leaves headroom).
[Service]
Environment=BUILD_LANE_PREFER=ryzen7
Environment=LANE_SKIP_PACE=300
ExecCondition=%h/.claude/skills/build/scripts/lane-defer.sh
ExecCondition=%h/.claude/skills/build/scripts/lane-has-work.sh
