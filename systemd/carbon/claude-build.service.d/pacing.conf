[Unit]
StartLimitIntervalSec=0

[Service]
# 20:12 lesson (RedBaron, pre-fixed here): TimeoutStartSec MUST exceed the
# ExecStartPost sleep below, or systemd kills the unit as timed-out mid-pace
# and the launcher retries in a tight loop. 400 > 300 leaves 100s headroom.
TimeoutStartSec=400
ExecStartPost=/usr/bin/sleep 300
