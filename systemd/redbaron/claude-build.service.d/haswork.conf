# build-has-work pre-check (2026-09-12): 10 of 24 RedBaron ticks in one day
# spent a full Sonnet session just to discover nothing was buildable
# (~4M tokens), right after the daily tick cap was removed — an unbounded
# spin risk with no cost floor. This ExecCondition runs build-has-work.sh
# (pure bash + git/python3, no model call) before the service is ever
# allowed to start, and skips the tick when no queued PRD is buildable
# (see the script's own header for the full predicate).
#
# BUILD_HASWORK_PACE: same rationale as defer.conf's LANE_SKIP_PACE — a
# condition-skip (exit 1) bypasses ExecStartPost pacing, and the claude-
# build.path unit is level-triggered, so an UNPACED skip re-fires roughly
# once a second while the queue stays empty. build-has-work.sh sleeps this
# many seconds before returning failure, holding the unit in "activating
# (condition)" for the window instead. Must stay under the sibling
# pacing.conf's TimeoutStartSec (400s) or systemd kills the unit as
# timed-out mid-sleep and the launcher retries in a tight loop — 300
# leaves the same 100s headroom defer.conf's LANE_SKIP_PACE does.
#
# This never stops, disables, or otherwise touches the loop itself — the
# path unit and timer stay armed exactly as before; only whether a given
# trigger is allowed to spend a (paid) tick changes.
[Service]
Environment=BUILD_HASWORK_PACE=300
ExecCondition=%h/.claude/skills/build/scripts/build-has-work.sh
